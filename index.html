 10px;border-radius:50px;background:#214b48;color:#7ef1bd;font-size:12px}input,select{width:100%;padding:13px;background:#243a52;color:white;border:1px solid #47627e;border-radius:12px;outline:none;margin:7px 0 12px}label{font-size:13px;color:#c3d2e4}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0d1a2a;border-top:1px solid #314257;padding-bottom:env(safe-area-inset-bottom);z-index:10}nav button{flex:1;background:none;border:0;color:#a1b5d1;padding:11px 2px;font-size:11px}nav button.active{color:#65a6ff;background:#182c44}nav button strong{display:block;font-size:21px;margin-bottom:4px}.hide{display:none!important}.section-title{font-size:21px;font-weight:800;margin:8px 0 16px}.note{padding:11px 13px;border-radius:12px;background:#493821;color:#f8d49d;font-size:13px}.success{background:#173c34;color:#8bf2c8}.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border-radius:10px;border:1px solid #34506d;padding:10px;background:#1b3048;color:white}.tabs button.active{background:#2961a9}.avatar{height:70px;width:70px;border-radius:17px;display:grid;place-items:center;font-size:40px;background:#254462}.profile-top{display:flex;gap:14px;align-items:center}.muted{color:var(--muted)}.stat{font-size:25px;font-weight:800}h3{margin:0 0 12px}p{line-height:1.5}button:disabled{opacity:.45;cursor:not-allowed}@media(min-width:700px){main{padding:25px}.grid{grid-template-columns:repeat(4,1fr)}}

:root{--bg:#070f18;--panel:#101b29;--line:#2b3b4e;--txt:#f3f6fc;--muted:#a8b8d2;--blue:#418fff;--green:#32d49b}

</style></head><body><header><div class="top"><div><div class="brand">👑 НОВАЯ ЖИЗНЬ</div><div class="tag">Твой путь. Твоя история.</div><div class="tag" id="game-clock">☀️ 1 игровой год = 2 дня</div></div><button class="round" onclick="openTab('settings')">⚙️</button></div></header><main id="app"></main><div id="modal-root"></div><nav id="nav" class="hide"><button data-tab="home" onclick="openTab('home')"><strong>⌂</strong>Главная</button><button data-tab="profile" onclick="openTab('profile')"><strong>♙</strong>Профиль</button><button data-tab="community" onclick="openTab('community')"><strong>♧</strong>Общение</button><button data-tab="map" onclick="openTab('map')"><strong>▣</strong>Карта</button><button data-tab="achievements" onclick="openTab('achievements')"><strong>🏆</strong>Награды</button></nav><script>
const KEY='nova_life_local_v3',DAY=86400000;
const SERVER_CONFIG_KEY='nova_life_server_url_v1';
const serverAdapter={get base(){return (localStorage.getItem(SERVER_CONFIG_KEY)||'').replace(/\/$/,'')},async health(){if(!this.base)throw Error('Адрес сервера не указан');let r=await fetch(this.base+'/api/health',{signal:AbortSignal.timeout(7000)});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}};

const jobs=[
['Продавец',2,3.5,.35,.15,'🛍️'],['Таксист',2.5,4.5,.4,.2,'🚕'],['Уборщик',2,3.2,.5,.2,'🧹'],['Курьер',2.3,4.2,.65,.25,'📦'],['Повар',2.4,5,.55,.25,'👨‍🍳'],['Автомеханик',2.8,6,.6,.25,'🔧'],['Строитель',3,6.5,.65,.25,'🏗️'],['Водитель грузовика',3.2,7,.55,.3,'🚛'],['Парикмахер',2.3,4.8,.4,.2,'✂️'],['Охранник',2.2,4,.45,.2,'🛡️'],['IT-специалист',2,8,.35,.2,'💻']];
const professions=jobs.map(j=>j[0]);
const studies=['Экономический лицей','Технический колледж','Школа искусств','IT-академия'];
const businessTypes=[['Клининговая компания',40,.5,'Уборщик'],['Киоск',60,.8,'Продавец'],['Парикмахерская',100,100/70,'Парикмахер'],['Кафе',150,150/65,'Повар'],['Таксопарк',220,220/60,'Таксист'],['Автосервис',350,7,'Автомеханик'],['Строительная компания',600,15,'Строитель'],['IT-компания',1000,1000/35,'IT-специалист']];
const RULES={yearDays:2,promotionShifts:[7,21,45],autobuyMultiplier:2,foodUnit:.35,waterUnit:.15,privateSlotsPerBusiness:2,withdrawalsEnabled:false,realMoneyEnabled:false,bankEnabled:false,marketMode:'fixed',businessMode:'fixed-net',inheritanceEnabled:false};
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!Array.isArray(db.users))db={users:[],active:null,nextId:1,events:[]};
db.nextId=Math.max(db.nextId||1,...db.users.map(u=>Number(u.id)||0).map(x=>x+1),1);
let tab='home',adminTarget=null;const app=document.getElementById('app'),nav=document.getElementById('nav');
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Не удалось сохранить игру: проверь память браузера')}}
function me(){return db.users.find(u=>u.id===db.active)}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return Number(n||0).toFixed(2).replace(/\.00$/,'')}
function round(n){return Math.round((n+Number.EPSILON)*100)/100}
function uid(n){return String(n).padStart(8,'0')}
function msg(s){alert(s)}
function jobInfo(name){return jobs.find(j=>j[0]===name)}
function level(shifts){return shifts>=45?3:shifts>=21?2:shifts>=7?1:0}
function wage(u){let j=jobInfo(u.job);if(!j)return 0;let lv=level(u.experience[u.job]||0);let base=j[1]+(j[2]-j[1])*lv/3;return round(base*(u.employer==='private'?1.12:1))}
function init(u){u.balance=Number.isFinite(+u.balance)?+u.balance:10;u.age=Number.isFinite(+u.age)?+u.age:16;u.education=Array.isArray(u.education)?u.education:[];u.specialties=Array.isArray(u.specialties)?u.specialties:[];u.experience=u.experience||{};u.inventory=u.inventory||{food:2,water:2};u.inventory.food=Number(u.inventory.food)||0;u.inventory.water=Number(u.inventory.water)||0;u.health=Number.isFinite(u.health)?u.health:100;u.energy=Number.isFinite(u.energy)?u.energy:100;u.studiedDays=u.studiedDays||0;u.lastTick=u.lastTick||Date.now();u.ageFraction=u.ageFraction||0;u.businesses=Array.isArray(u.businesses)?u.businesses:[];u.employer=u.employer||'state';u.job=u.job||'';u.home=u.home||'Общежитие';u.family=u.family||'Не женат';u.history=Array.isArray(u.history)?u.history:[];u.hungerDays=u.hungerDays||0;u.study=u.study||'';u.alive=u.alive!==false;u.workdays=u.workdays||0;return u}
db.users.forEach(init);
function log(u,text){u.history.unshift(new Date().toLocaleDateString('ru-RU')+' · '+text);u.history=u.history.slice(0,40)}
function ageOneDay(u){u.ageFraction+=.5;if(u.ageFraction>=1){u.age+=Math.floor(u.ageFraction);u.ageFraction%=1}}
function consume(u,kind,qty,price){let own=Math.min(qty,u.inventory[kind]);u.inventory[kind]=round(u.inventory[kind]-own);let missing=round(qty-own);if(missing<=0)return true;let cost=round(missing*price*RULES.autobuyMultiplier);if(u.balance+1e-8>=cost){u.balance=round(u.balance-cost);log(u,'Автопокупка '+(kind==='food'?'еды':'воды')+' −'+fmt(cost)+' ₴');return true}u.health=Math.max(0,u.health-(kind==='food'?12:18));return false}
function processDay(u){if(!u.alive)return;ageOneDay(u);if(u.study&&u.age<18){u.studiedDays++;u.balance=round(u.balance+.5);if(u.studiedDays>=2){if(!u.education.includes(u.study))u.education.push(u.study);u.specialties=[...new Set([...u.specialties,...professions.slice(0,4)])];log(u,'Обучение завершено: '+u.study);u.study=''}}
if(u.job&&u.age>=18&&u.health>20){let pay=wage(u);u.balance=round(u.balance+pay);u.experience[u.job]=(u.experience[u.job]||0)+1;u.workdays++;u.energy=Math.max(0,u.energy-(u.employer==='private'?17:14));log(u,'Зарплата '+u.job+' +'+fmt(pay)+' ₴')}
for(let b of u.businesses){let net=businessTypes[b.type]?.[2]||0;b.balance=round((b.balance||0)+net);b.earned=round((b.earned||0)+net)}
let j=jobInfo(u.job);let food=j?j[3]:.35,water=j?j[4]:.15;let f=consume(u,'food',food,RULES.foodUnit),w=consume(u,'water',water,RULES.waterUnit);u.hungerDays=f&&w?0:u.hungerDays+1;u.energy=Math.min(100,u.energy+25);if(f&&w)u.health=Math.min(100,u.health+.3);if(u.hungerDays>=4)u.health=Math.max(0,u.health-5);if(u.health<=0){u.alive=false;u.job='';log(u,'Персонаж умер от истощения')}if(u.age>=85&&u.health<35){u.alive=false;u.job='';log(u,'Жизнь персонажа завершилась')}}
function tick(){let changed=false,now=Date.now();for(let u of db.users){init(u);let elapsed=Math.max(0,Math.min(365,Math.floor((now-u.lastTick)/DAY)));if(elapsed){for(let i=0;i<elapsed;i++)processDay(u);u.lastTick+=elapsed*DAY;changed=true}}if(changed)save()}

function closeModal(){document.getElementById('modal-root').innerHTML=''}
function showJob(name,employer='state',employerId=''){
 let u=me(),j=jobInfo(name);if(!j)return;
 let exp=u.experience[name]||0;let levels=[0,7,21,45];
 let rows=levels.map((s,i)=>{let pay=round((j[1]+(j[2]-j[1])*i/3)*(employer==='private'?1.12:1));return `<div class="wage-step"><span>${i===0?'Начало карьеры':'После '+s+' смен'} ${exp>=s?'✓':''}</span><b class="balance">${fmt(pay)} ₴/сутки</b></div>`}).join('');
 let allowed=u.alive&&u.age>=18;
 document.getElementById('modal-root').innerHTML=`<div class="modal-cover" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="Вакансия ${esc(name)}"><button class="modal-close" onclick="closeModal()">✕</button><div class="pill">${employer==='state'?'Государственная вакансия':'Частная вакансия'}</div><h2 style="margin-top:14px">${j[5]} ${esc(name)}</h2><p class="small">Стаж в этой профессии: ${exp} смен. При смене работы опыт сохраняется.</p><h3>💰 Зарплата и повышения</h3>${rows}<h3 style="margin-top:19px">🥪 Расходы и нагрузка</h3><div class="row"><span>Еда за сутки</span><b>${fmt(j[3])} ед.</b></div><div class="row"><span>Вода за сутки</span><b>${fmt(j[4])} ед.</b></div><div class="row"><span>Рабочий график</span><b>1 смена / сутки</b></div><div class="row"><span>Минимальный возраст</span><b>18 лет</b></div><p class="small">Зарплата начисляется автоматически, в том числе офлайн. При нехватке запасов автопокупка обходится вдвое дороже.</p><button class="primary" style="width:100%" ${allowed?'':'disabled'} onclick="takeJob('${name}','${employer}','${employerId}');closeModal()">${allowed?'Устроиться на работу':'Доступно с 18 лет'}</button></section></div>`;
}
function showTopup(){document.getElementById('modal-root').innerHTML=`<div class="modal-cover" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true"><button class="modal-close" onclick="closeModal()">✕</button><h2>💳 Пополнение баланса</h2><p>Пополнение настоящими деньгами пока не подключено. После подключения платёжного провайдера здесь появятся суммы и подтверждение оплаты.</p><p class="small">Никаких игровых начислений без подтверждённой оплаты.</p><button class="secondary" onclick="closeModal()">Понятно</button></section></div>`}
function showBusiness(i){let b=businessTypes[i],u=me();if(!b)return;document.getElementById('modal-root').innerHTML=`<div class="modal-cover" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true"><button class="modal-close" onclick="closeModal()">✕</button><h2>🏢 ${esc(b[0])}</h2><div class="row line"><span>Цена предприятия</span><b>${fmt(b[1])} ₴</b></div><div class="row line"><span>Чистая прибыль за сутки</span><b class="balance">${fmt(b[2])} ₴</b></div><div class="row line"><span>Расчётная окупаемость</span><b>${Math.round(b[1]/b[2])} реальных дней</b></div><div class="row line"><span>Профессия сотрудников</span><b>${esc(b[3])}</b></div><p class="small">Прибыль фиксирована для текущей версии. После подключения общей экономики будут учитываться спрос, выплаты сотрудникам и расходы.</p><button class="primary" style="width:100%" ${u.age<18||!u.alive||u.balance<b[1]?'disabled':''} onclick="buyBusiness(${i});closeModal()">Купить за ${fmt(b[1])} ₴</button></section></div>`}
async function testServer(){try{let data=await serverAdapter.health();msg('Сервер отвечает: '+(data.status||'OK'))}catch(e){msg('Не удалось связаться с сервером: '+e.message)}}
function saveServerUrl(){let value=document.getElementById('server-url').value.trim().replace(/\/$/,'');if(value&&!/^https:\/\//i.test(value))return msg('Нужен HTTPS-адрес Railway');localStorage.setItem(SERVER_CONFIG_KEY,value);msg('Адрес сохранён. Игровые данные пока остаются локальными.');render()}

function register(){let name=document.getElementById('name').value.trim();if(name.length<2||name.length>24)return msg('Имя: от 2 до 24 символов');let id=uid(db.nextId++),admin=id==='00000001';let u=init({id,name,age:admin?18:16,balance:10,job:'',role:admin?'admin':'player',education:admin?[...studies]:[],specialties:admin?[...professions]:[],created:Date.now(),lastTick:Date.now(),study:'',ref:document.getElementById('ref').value.trim()});db.users.push(u);db.active=id;save();openTab('home')}
function login(){let id=document.getElementById('loginid').value.trim();if(!db.users.some(u=>u.id===id))return msg('Такого ID нет на этом устройстве');db.active=id;save();openTab('home')}
function logout(){db.active=null;save();render()}
function openTab(t){tab=t;render();window.scrollTo(0,0)}
function render(){tick();let u=me();nav.classList.toggle('hide',!u);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(!u){app.innerHTML=`<div class="card hero"><div class="section-title">Добро пожаловать в НОВУЮ ЖИЗНЬ</div><p class="muted">Создай персонажа. Построй карьеру, семью и собственный бизнес.</p><label>Имя персонажа</label><input id="name" maxlength="24" placeholder="Имя персонажа"><label>Код пригласившего (необязательно)</label><input id="ref" placeholder="00000002"><button class="primary" onclick="register()">Начать новую жизнь →</button></div><div class="card"><h3>Уже играю</h3><input id="loginid" placeholder="ID персонажа"><button class="secondary" onclick="login()">Войти</button></div><p class="small">Персонажи сохраняются на этом устройстве. Для общей игры позже подключим сервер.</p>`;return}let views={home,profile,work,study,shop,bank,business,admin,settings,community,map,achievements};app.innerHTML=(views[tab]||home)(u)}
function home(u){return `<div class="card hero"><div class="small">🌤️ Твоя история начинается здесь</div><div class="profile-top" style="margin:16px 0"><div class="avatar">🧑</div><div><div class="big">${esc(u.name)}</div><div>${u.age} лет · ${esc(u.job||'Без работы')}</div><div class="small">ID ${u.id} ${u.role==='admin'?'· Администратор':''}</div></div></div><div class="row line"><span>🎓 Образование</span><b>${esc(u.study||u.education.at(-1)||'Не выбрано')}</b></div><div class="row line"><span>🏠 Жильё</span><b>${esc(u.home)}</b></div><div class="row"><span>👥 Семья</span><b>${esc(u.family)}</b></div></div><div class="grid"><div class="card"><div class="small">💚 Игровой баланс</div><div class="big balance">${fmt(u.balance)} ₴</div><button class="green-button" onclick="showTopup()">Пополнить</button></div><div class="card"><div class="small">🪙 Доступно к выводу</div><div class="big">0 ₴</div><button class="disabled-pay" disabled>Вывести</button><div class="tiny">В разработке</div></div></div><div class="card"><h3>🎓 Обучение</h3><div class="row"><span>${esc(u.study||u.education.at(-1)||'Не выбрано')}</span><button class="secondary" onclick="openTab('study')">Открыть ›</button></div><div class="progress-track"><div class="progress-fill" style="width:${u.study?Math.min(100,u.studiedDays*50):u.education.length?100:0}%"></div></div><p class="small">${u.study?'Обучение: '+u.studiedDays+'/2 суток':'Выбери направление обучения'}</p></div><div class="card"><div class="row"><span>❤️ Здоровье</span><b>${fmt(u.health)}%</b></div><div class="row"><span>⚡ Энергия</span><b>${fmt(u.energy)}%</b></div><div class="row"><span>🥪 Еда / 💧 Вода</span><b>${fmt(u.inventory.food)} / ${fmt(u.inventory.water)}</b></div><p class="small">1 игровой год = 2 реальных дня. Зарплата и расходы — каждые реальные сутки, даже офлайн.</p></div>${u.alive?'':`<div class="note">История персонажа завершилась. Наследование добавим после подключения общей экономики.</div>`}<div class="grid"><button class="tile" onclick="openTab('work')">💼<b>Работа</b><span>Карьера и стаж</span></button><button class="tile" onclick="openTab('study')">🎓<b>Учёба</b><span>Образование</span></button><button class="tile" onclick="openTab('shop')">🛒<b>Магазин</b><span>Еда и вода</span></button><button class="tile" onclick="openTab('bank')">🏦<b>Банк</b><span>Финансы</span></button><button class="tile" onclick="openTab('business')">🏢<b>Бизнес</b><span>Купить предприятие</span></button></div>${u.role==='admin'?'<div class="card"><h3>🛡️ Управление Республикой</h3><button class="primary" onclick="openTab(\'admin\')">Админ-панель →</button></div>':''}<div class="card"><h3>📰 Новости Республики</h3><p class="small">Государство обеспечивает базовую работу. Частные предприятия открывают ограниченные вакансии.</p></div>`}
function profile(u){return `<div class="section-title">Мой профиль</div><div class="card"><div class="profile-top"><div class="avatar">🧑</div><div><h3>${esc(u.name)}</h3><div class="small">ID: ${u.id}</div><div class="pill">${u.role==='admin'?'Администратор':'Житель Республики'}</div></div></div></div><div class="card">${[['Возраст',u.age+' лет'],['Баланс',fmt(u.balance)+' ₴'],['Работа',u.job||'Нет'],['Работодатель',u.employer==='private'?'Частный':'Государство'],['Всего смен',u.workdays],['Образование',u.education.join(', ')||'Нет'],['Квалификаций',u.specialties.length],['Предприятий',u.businesses.length],['Здоровье',fmt(u.health)+'%']].map(([a,b])=>`<div class="row line"><span>${a}</span><b>${esc(b)}</b></div>`).join('')}</div><div class="card"><h3>📜 История операций</h3>${u.history.length?u.history.slice(0,15).map(x=>`<div class="line small">${esc(x)}</div>`).join(''):'<p class="small">Пока нет операций</p>'}</div>`}
function work(u){let j=jobInfo(u.job),sh=u.experience[u.job]||0;return `<div class="section-title">💼 Работа и карьера</div><div class="card"><h3>${esc(u.job||'Работа не выбрана')}</h3><div class="row"><span>Работодатель</span><b>${u.job?(u.employer==='private'?'Частный':'Государство'):'—'}</b></div><div class="row"><span>Оплата за сутки</span><b class="balance">${fmt(wage(u))} ₴</b></div><div class="row"><span>Отработано смен</span><b>${sh}</b></div><div class="row"><span>Карьерный уровень</span><b>${level(sh)+1}/4</b></div><p class="small">Повышения после 7, 21 и 45 смен. Стаж сохраняется при смене работы. Зарплата начисляется автоматически раз в 24 часа, в том числе офлайн.</p></div><div class="card"><h3>Государственная работа</h3>${jobs.map(j=>`<div class="row line"><div><b>${j[5]} ${esc(j[0])}</b><div class="small">От ${fmt(j[1])} до ${fmt(j[2])} ₴/сутки · еда ${fmt(j[3])} · вода ${fmt(j[4])}</div></div><button class="secondary" ${!u.alive||u.age<18?'disabled':''} onclick="showJob('${j[0]}','state')">${u.job===j[0]&&u.employer==='state'?'Выбрано':'Устроиться'}</button></div>`).join('')}</div><div class="card"><h3>🏢 Частные вакансии</h3><p class="small">Частные предприятия дают +12% к ставке, но количество мест ограничено. Выплаты в этой локальной версии расчётные.</p>${db.users.flatMap(owner=>owner.businesses.map((b,i)=>({owner,b,i}))).map(({owner,b,i})=>{let bt=businessTypes[b.type],count=db.users.filter(x=>x.employer==='private'&&x.employerId===owner.id+':'+i).length;return `<div class="row line"><div><b>${esc(bt[0])}</b><div class="small">${esc(bt[3])} · мест ${count}/${RULES.privateSlotsPerBusiness}</div></div><button class="secondary" ${!u.alive||u.age<18||count>=RULES.privateSlotsPerBusiness?'disabled':''} onclick="showJob('${bt[3]}','private','${owner.id}:${i}')">Устроиться</button></div>`}).join('')||'<p class="small">Частные вакансии появятся после покупки предприятий.</p>'}</div>`}
function takeJob(name,employer='state',employerId=''){let u=me();if(!u.alive||u.age<18)return msg('Для работы нужно достичь 18 лет');if(!professions.includes(name))return; if(employer==='private'){let count=db.users.filter(x=>x.employer==='private'&&x.employerId===employerId).length;if(count>=RULES.privateSlotsPerBusiness)return msg('Мест больше нет')}u.job=name;u.employer=employer;u.employerId=employerId;log(u,'Устроился: '+name+' ('+(employer==='state'?'государство':'частная компания')+')');save();render()}
function study(u){return `<div class="section-title">🎓 Образование</div><div class="card"><h3>Текущая учёба</h3><p>${esc(u.study||'Не выбрана')}</p><p class="small">Для обучения требуется 2 реальные суточные отметки. После завершения начисляется квалификация. Стипендия 0,50 ₴ в сутки до 18 лет.</p></div><div class="card"><h3>Куда поступить?</h3>${studies.map(s=>`<div class="row line"><span>${esc(s)}</span><button class="secondary" ${!u.alive?'disabled':''} onclick="chooseStudy('${s}')">${u.study===s?'Учусь':'Поступить'}</button></div>`).join('')}</div><div class="card"><h3>Завершённые программы</h3><p>${esc(u.education.join(', ')||'Пока нет')}</p></div>`}
function chooseStudy(s){let u=me();if(!u.alive)return;if(!studies.includes(s))return;u.study=s;u.studiedDays=0;save();render()}
function shop(u){return `<div class="section-title">🛒 Магазин</div><div class="card"><h3>Продукты и запасы</h3><p class="small">Если запасов не хватит, система автоматически купит недостающее по цене ×2. При нехватке денег ухудшится здоровье.</p>${[['food','🥪 Еда',.35],['water','💧 Вода',.15]].map(([kind,name,price])=>`<div class="row line"><div><b>${name}</b><div class="small">Запас: ${fmt(u.inventory[kind])} · цена за единицу ${fmt(price)} ₴</div></div><button class="secondary" ${!u.alive?'disabled':''} onclick="buySupply('${kind}',1,${price})">Купить 1</button></div>`).join('')}</div>`}
function buySupply(kind,qty,price){let u=me();if(!u.alive||u.balance<price)return msg('Недостаточно денег');u.balance=round(u.balance-price);u.inventory[kind]=round(u.inventory[kind]+qty);log(u,'Куплено '+(kind==='food'?'еды':'воды')+' −'+fmt(price)+' ₴');save();render()}
function business(u){return `<div class="section-title">🏢 Предприятия</div><div class="card"><h3>Мои предприятия</h3>${u.businesses.map((b,i)=>{let bt=businessTypes[b.type];return `<div class="line"><b>${esc(bt[0])}</b><div class="row"><span>На счёте предприятия: ${fmt(b.balance)} ₴</span><button class="secondary" onclick="withdrawBusiness(${i})">Забрать прибыль</button></div><div class="small">Чистая прибыль ${fmt(bt[2])} ₴/сутки · окупаемость ~${Math.round(bt[1]/bt[2])} суток</div></div>`}).join('')||'<p class="small">Предприятий пока нет.</p>'}</div><div class="card"><h3>Купить бизнес</h3><p class="small">Доходы и цены фиксированы. Прибыль начисляется на отдельный счёт предприятия раз в реальные сутки, включая офлайн. Это расчётная чистая прибыль, не настоящие платежи клиентов.</p>${businessTypes.map((b,i)=>`<div class="row line"><div><b>${esc(b[0])}</b><div class="small">${fmt(b[1])} ₴ · ${fmt(b[2])} ₴/сутки · ~${Math.round(b[1]/b[2])} дней</div></div><button class="secondary" ${u.balance<b[1]||!u.alive||u.age<18?'disabled':''} onclick="showBusiness(${i})">Подробнее</button></div>`).join('')}</div>`}
function buyBusiness(i){let u=me(),b=businessTypes[i];if(!b||!u.alive||u.age<18||u.balance<b[1])return msg('Недостаточно денег или возраста');u.balance=round(u.balance-b[1]);u.businesses.push({type:i,balance:0,earned:0,bought:Date.now()});log(u,'Куплен бизнес '+b[0]+' −'+fmt(b[1])+' ₴');save();render()}
function withdrawBusiness(i){let u=me(),b=u.businesses[i];if(!b||b.balance<=0)return msg('Пока нет прибыли');u.balance=round(u.balance+b.balance);log(u,'Перевод прибыли предприятия +'+fmt(b.balance)+' ₴');b.balance=0;save();render()}
function bank(u){return `<div class="section-title">🏦 Финансы</div><div class="grid"><div class="card"><div class="small">💚 Игровой баланс</div><div class="big balance">${fmt(u.balance)} ₴</div><button class="green-button" onclick="showTopup()">Пополнить</button></div><div class="card"><div class="small">🪙 Доступно к выводу</div><div class="big">0 ₴</div><button class="disabled-pay" disabled>Вывести</button><div class="tiny" style="margin-top:8px">В разработке</div></div></div><div class="card"><h3>История операций</h3>${u.history.slice(0,12).map(x=>`<div class="line small">${esc(x)}</div>`).join('')||'<p class="small">Пока нет операций</p>'}</div></div>`}
function community(u){return `<div class="section-title">👥 Общение</div><div class="card"><h3>Жители Республики</h3>${db.users.map(x=>`<div class="row line"><span>${esc(x.name)}</span><span class="small">${x.id}</span></div>`).join('')}<p class="small">Сейчас видны только персонажи этого браузера. Чат будет после подключения сервера.</p></div>`}
function map(u){return `<div class="section-title">🗺️ Карта Республики</div><div class="card"><h3>Твой город</h3><p>🏫 Учёба · 🏢 Работа · 🛒 Магазины · 🏦 Банк</p><p class="small">Районы и здания добавим после запуска базовой экономики.</p></div>`}
function achievements(u){return `<div class="section-title">🏆 Достижения</div><div class="card"><h3>🌟 Начало истории</h3><div class="pill">Получено</div></div>${u.job?'<div class="card"><h3>💼 Первая работа</h3><div class="pill">Получено</div></div>':''}${u.businesses.length?'<div class="card"><h3>🏢 Предприниматель</h3><div class="pill">Получено</div></div>':''}`}
function settings(u){return `<div class="section-title">⚙️ Настройки</div><div class="card"><div class="row"><span>Игровой ID</span><b>${u.id}</b></div><button class="secondary" onclick="exportData()">Скачать резервную копию</button><p class="small">Данные хранятся только в браузере. Сохраните копию перед очисткой памяти телефона.</p></div>${u.role==='admin'?'<div class="card"><button class="primary" onclick="openTab(\'admin\')">🛡️ Админ-панель</button></div>':''}<div class="card"><h3>🌐 Подключение Railway</h3><p class="small">Адрес сервера можно указать заранее. До запуска защищённой синхронизации экономика остаётся на этом устройстве.</p><label>Адрес сервера (HTTPS)</label><input id="server-url" placeholder="https://имя.up.railway.app" value="${esc(serverAdapter.base)}"><button class="secondary" onclick="saveServerUrl()">Сохранить адрес</button> <button class="secondary" onclick="testServer()">Проверить связь</button></div><div class="card"><button class="secondary" onclick="logout()">Выйти</button></div>`}
function exportData(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='nova-life-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function admin(u){if(u.role!=='admin')return '<div class="note">Доступ запрещён</div>';let t=db.users.find(x=>x.id===adminTarget)||u;return `<div class="section-title">🛡️ Админ-панель</div><div class="note">Права администратора работают только для локальной проверки. В многопользовательской версии доступ должен проверять сервер.</div><div class="card" style="margin-top:14px"><h3>Редактировать персонажа</h3><label>Игрок</label><select onchange="adminTarget=this.value;render()">${db.users.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${esc(x.name)} · ${x.id}</option>`).join('')}</select>${[['Имя','name',t.name,'text'],['Возраст','age',t.age,'number'],['Баланс, ₴','balance',t.balance,'number'],['Здоровье','health',t.health,'number'],['Энергия','energy',t.energy,'number'],['Запас еды','food',t.inventory.food,'number'],['Запас воды','water',t.inventory.water,'number']].map(([label,id,val,type])=>`<label>${label}</label><input id="a-${id}" type="${type}" value="${esc(val)}" ${type==='number'?'step="0.01"':''}>`).join('')}<label>Работа</label><select id="a-job"><option value="">Нет</option>${professions.map(p=>`<option ${t.job===p?'selected':''}>${esc(p)}</option>`).join('')}</select><label>Учёба</label><select id="a-study"><option value="">Не выбрана</option>${studies.map(p=>`<option ${t.study===p?'selected':''}>${esc(p)}</option>`).join('')}</select><h3>Завершённое образование</h3>${studies.map((p,i)=>`<label style="display:block"><input class="a-edu" type="checkbox" value="${i}" style="width:auto" ${t.education.includes(p)?'checked':''}> ${esc(p)}</label>`).join('')}<h3 style="margin-top:14px">Открытые специальности</h3>${professions.map((p,i)=>`<label style="display:block"><input class="a-spec" type="checkbox" value="${i}" style="width:auto" ${t.specialties.includes(p)?'checked':''}> ${esc(p)}</label>`).join('')}<button class="primary" style="margin-top:16px" onclick="saveAdmin('${t.id}')">Сохранить изменения</button></div>`}
function saveAdmin(id){if(me()?.role!=='admin')return;let t=db.users.find(x=>x.id===id);if(!t)return;let name=document.getElementById('a-name').value.trim(),age=+document.getElementById('a-age').value,balance=+document.getElementById('a-balance').value,health=+document.getElementById('a-health').value,energy=+document.getElementById('a-energy').value,food=+document.getElementById('a-food').value,water=+document.getElementById('a-water').value;if(name.length<2||!Number.isInteger(age)||age<0||age>120||[balance,health,energy,food,water].some(x=>!Number.isFinite(x)||x<0)||health>100||energy>100)return msg('Проверь значения');Object.assign(t,{name,age,balance:round(balance),health,energy,job:document.getElementById('a-job').value,study:document.getElementById('a-study').value});t.inventory={food:round(food),water:round(water)};t.education=[...document.querySelectorAll('.a-edu:checked')].map(e=>studies[+e.value]);t.specialties=[...document.querySelectorAll('.a-spec:checked')].map(e=>professions[+e.value]);t.alive=health>0;t.employer='state';t.employerId='';log(t,'Администратор изменил параметры');save();render();msg('Сохранено')}
// Будущие серверные модули: ledger (двойная запись), payroll (бюджет предприятия),
// vacancy allocation, player-to-business payments, taxation, inheritance, fraud checks,
// payout requests and KYC. Вывод средств выключен до серверной реализации.
render();
</script></body></html>
