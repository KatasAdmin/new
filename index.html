<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>НОВАЯ ЖИЗНЬ</title><style>
:root{color-scheme:dark;font-family:system-ui;background:#101827;color:#eef3ff}body{max-width:720px;margin:auto;padding:18px}h1{font-size:25px}section{background:#1b2940;border:1px solid #33465f;border-radius:15px;padding:16px;margin:12px 0}button,input,select{padding:11px;border-radius:9px;border:1px solid #526782;background:#283b55;color:white;margin:4px}button{cursor:pointer;background:#2b65c9}button:disabled{opacity:.5}.muted{color:#a9bdd6}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.item{padding:8px 0;border-bottom:1px solid #354963}.error{color:#ff9898}.good{color:#85e3b1}</style></head><body>
<h1>🌍 НОВАЯ ЖИЗНЬ</h1><p class="muted">Экономический симулятор · тестовая версия</p>
<section><label>Адрес API Railway <input id="api" placeholder="https://...up.railway.app" style="width:90%"></label><div><button onclick="saveApi()">Сохранить адрес</button></div><div id="auth"><input id="name" placeholder="Имя персонажа"><input id="invite" type="number" placeholder="Код друга (необязательно)"><button onclick="register()">Создать персонажа</button><p>Уже есть токен? <input id="tokenInput" placeholder="Токен доступа"><button onclick="login()">Войти</button></p></div><div id="msg"></div></section>
<div id="game" hidden><section><div class="row"><h2 id="who"></h2><button onclick="refresh()">Обновить</button></div><div id="stats"></div><button onclick="action('/bonus/daily')">🎁 +1 ₴ за вход</button><button onclick="action('/needs/buy')">🥗 Купить потребности за 1,30 ₴</button></section><section><h2>💼 Работа</h2><select id="jobs"></select><button onclick="action('/job/'+document.getElementById('jobs').value)">Устроиться</button><p id="task"></p><button onclick="action('/tasks/complete')">Выполнить задание</button></section><section><h2>🏢 Предприятия</h2><div id="businesses"></div></section><section><h2>🤝 Приглашения</h2><p>Твой код: <b id="code"></b></p><p class="muted">Уровни: 5% · 3% · 1,5% · 0,75% · 0,25% · 0,1%</p></section><section><h2>📜 История</h2><div id="ledger"></div></section></div>
<script>
let API=localStorage.getItem('nova_api')||'',TOKEN=localStorage.getItem('nova_token')||'';document.getElementById('api').value=API;
function message(s,err=false){document.getElementById('msg').innerHTML='<p class="'+(err?'error':'good')+'">'+String(s).replaceAll('<','&lt;')+'</p>'}
function saveApi(){API=document.getElementById('api').value.trim().replace(/\/$/,'');localStorage.setItem('nova_api',API);message('Адрес сохранён');if(TOKEN)refresh()}
async function request(path,method='GET',body){if(!API)throw Error('Укажи адрес Railway');let r=await fetch(API+path,{method,headers:{...(TOKEN?{'Authorization':'Bearer '+TOKEN}:{}),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});let x=await r.json();if(!r.ok)throw Error(typeof x.detail==='string'?x.detail:'Ошибка запроса');return x}
async function register(){try{let x=await request('/register','POST',{name:document.getElementById('name').value,referral_code:Number(document.getElementById('invite').value)||null});TOKEN=x.token;localStorage.setItem('nova_token',TOKEN);message('Аккаунт создан. Сохрани токен доступа!');refresh()}catch(e){message(e.message,true)}}
function login(){TOKEN=document.getElementById('tokenInput').value.trim();localStorage.setItem('nova_token',TOKEN);refresh()}
async function action(path){try{let x=await request(path,'POST');message('Готово! '+(x.earned?'+'+x.earned+' ₴':''));await refresh()}catch(e){message(e.message,true)}}
async function refresh(){try{let [p,c,t,l]=await Promise.all([request('/me'),request('/catalog'),request('/tasks'),request('/ledger')]);document.getElementById('auth').hidden=true;document.getElementById('game').hidden=false;document.getElementById('who').textContent=p.name;document.getElementById('stats').textContent=`Баланс: ${p.balance} ₴ · Возраст: ${p.age} · ${p.alive?'Жив':'Персонаж умер'} · Профессия: ${p.job||'нет'} · ЗП: ${p.salary_per_day} ₴/день · Голод: ${p.hunger_days}/7`;document.getElementById('code').textContent=p.referral_code;document.getElementById('jobs').innerHTML=Object.entries(c.jobs).map(([k,v])=>`<option value="${k}">${v.name}: ${v.salary_levels.join(' / ')} ₴</option>`).join('');document.getElementById('task').textContent=t.task?`${t.task} (+${t.reward} ₴) · ${t.available?'доступно':'выполнено'}`:'Сначала устройся на работу';document.getElementById('businesses').innerHTML=Object.entries(c.businesses).map(([k,v])=>`<div class="row item"><span>${v.name}<br><small class="muted">${v.price} ₴ · +${v.income_per_day} ₴/день</small></span><button data-kind="${k}">Купить</button></div>`).join('');document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>action('/business/'+b.dataset.kind+'/buy'));document.getElementById('ledger').innerHTML=l.slice(0,15).map(x=>`<div class="item">${x.amount>0?'+':''}${x.amount} ₴ · ${x.reason.replaceAll('<','&lt;')}</div>`).join('')||'Операций пока нет'}catch(e){message(e.message,true)}}
if(API&&TOKEN)refresh();
</script></body></html>
