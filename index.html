<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0a1120">
<title>НОВАЯ ЖИЗНЬ — виртуальная экономика</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#e9f1ff;background:#0a1120;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#0a1120,#101e35 65%,#0b1425);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:950px;margin:auto;padding:20px 16px 100px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand h1{font-size:23px;letter-spacing:.4px;margin:0}.muted{color:#91a4bf}.small{font-size:13px}.pill{background:#1b304e;color:#b5d6ff;padding:8px 12px;border-radius:100px;font-size:12px}.panel{background:#15243a;border:1px solid #2a3f5c;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 12px 35px #0002}.panel h2{font-size:21px;margin:0 0 8px}.panel h3{font-size:17px;margin:0 0 12px}.intro{padding:28px 22px}.intro h2{font-size:28px}.field{display:block;margin:16px 0 6px;color:#b5c5d9}.input{width:100%;border:1px solid #38516d;border-radius:13px;background:#20344e;color:white;padding:14px 15px;outline:none}.input:focus{border-color:#65a4ff}.btn{background:#2869d6;color:white;border:0;border-radius:13px;padding:13px 16px;font-weight:650}.btn.secondary{background:#243a56}.btn.ghost{background:transparent;border:1px solid #395474}.btn.danger{background:#603041}.btn:active{transform:translateY(1px)}.full{width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{background:#1c304b;padding:15px;border-radius:15px}.stat b{display:block;font-size:22px;margin:5px 0}.stat span{color:#9db2cc;font-size:13px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:5px 0 12px;scrollbar-width:none}.tabs button{white-space:nowrap;background:#192b43;border:1px solid #2a405e;color:#b8c8dc;border-radius:11px;padding:11px 14px}.tabs button.active{background:#2869d6;color:white;border-color:#2869d6}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}.row>div{min-width:0}.line{height:1px;background:#30445f;margin:14px 0}.list{display:flex;flex-direction:column;gap:10px}.item{padding:14px;border:1px solid #2e4562;background:#1a2d46;border-radius:14px}.item strong{display:block}.item p{margin:7px 0;color:#a7bbd3;font-size:13px}.item .btn{margin-top:8px}.ok{color:#85e3b5}.warn{color:#ffce8e}.error{color:#ff9eaa}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#263f60;color:white;border:1px solid #6384ac;padding:13px 18px;border-radius:12px;max-width:90vw;z-index:5;box-shadow:0 10px 35px #0007}.hidden{display:none!important}.note{font-size:13px;line-height:1.55;color:#aebed3}.actions{display:flex;flex-wrap:wrap;gap:8px}.hero{background:linear-gradient(120deg,#203e67,#142740)}.money{font-size:33px;font-weight:750;letter-spacing:-.7px}.empty{color:#9aacc2;text-align:center;padding:22px 6px}footer{text-align:center;color:#687d9b;font-size:12px;margin-top:30px}input[type=file]{display:none}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.brand h1{font-size:28px}}@media(max-width:380px){.brand h1{font-size:19px}.panel{padding:15px}}
</style>
</head>
<body><div class="wrap"><header class="brand"><h1>🌍 НОВАЯ ЖИЗНЬ</h1><span class="pill">Виртуальная экономика</span></header><main id="app"></main><footer>НОВАЯ ЖИЗНЬ · Мир твоих решений · Внутриигровая валюта</footer></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const KEY='nova_life_single_v1', DAY=86400000;
const JOBS=[['Продавец','Магазин'],['Таксист','Такси'],['Уборщик','Клининговая компания'],['Курьер','Доставка'],['Повар','Кафе'],['Автомеханик','Автосервис'],['Строитель','Строительная компания'],['Водитель грузовика','Грузоперевозки'],['Парикмахер','Парикмахерская'],['Охранник','Охранная компания'],['IT-специалист','IT-компания']];
const BUSINESSES=[{name:'Магазин',cost:25,revenue:1.9},{name:'Такси',cost:30,revenue:2.1},{name:'Клининговая компания',cost:28,revenue:1.8},{name:'Доставка',cost:32,revenue:2.2},{name:'Кафе',cost:35,revenue:2.4},{name:'Автосервис',cost:45,revenue:2.8},{name:'Строительная компания',cost:65,revenue:3.4},{name:'Грузоперевозки',cost:55,revenue:3.1},{name:'Парикмахерская',cost:30,revenue:2.0},{name:'Охранная компания',cost:40,revenue:2.6},{name:'IT-компания',cost:75,revenue:4.0}];
// Local solo economic model: purchases transfer money between the player's personal and business accounts.
// External simulated customers and salaries are explicitly modeled as scenario flows, not a closed multiplayer economy.
let state=load(),tab='home',toastTimer;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.version===1?s:null}catch{return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function money(v){return (Math.round(v*100)/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₴'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3600)}
function age(s){let d=s.days;return d<2?16+d:18+Math.floor((d-2)/7)}
function dayProgress(){if(!state)return 0;return Math.max(0,Math.floor((Date.now()-state.lastTick)/DAY))}
function log(text){state.logs.unshift({day:state.days,text});state.logs=state.logs.slice(0,70)}
function startDay(){state.days++;const a=age(state);if(a<18){state.cash=+(state.cash+.5).toFixed(2);log('Стипендия экономического лицея: +0,50 ₴');if(a===18)log('Поздравляем! Лицей окончен. Доступны работа и бизнес.');return}
 if(state.job!==null){const j=state.job;const salary=JOBS[j][0]==='IT-специалист'?1.5:1;state.cash=+(state.cash+salary).toFixed(2);state.earned=+(state.earned+salary).toFixed(2);log('Зарплата ('+JOBS[j][0]+'): +'+money(salary))}
 // For solo preview, external buyers generate business turnover; these are simulated inflows.
 for(const b of state.businesses){const type=BUSINESSES[b.type];const revenue=type.revenue;const payroll=1.0;const overhead=.25;const profit=+(revenue-payroll-overhead).toFixed(2);b.balance=+(b.balance+profit).toFixed(2);b.total=+(b.total+profit).toFixed(2);state.businessEarned=+(state.businessEarned+profit).toFixed(2)}
 if(state.businesses.length)log('Прибыль предприятий поступила на счета бизнеса');
 const food=state.autoFood?.35:.2;state.cash=+(state.cash-food).toFixed(2);state.spent=+(state.spent+food).toFixed(2);log('Питание: −'+money(food));if(state.cash<0){state.cash=0;log('Не хватило денег на питание. Нужен источник дохода.')}}
function sync(){if(!state)return;const n=Math.min(dayProgress(),365);if(n>0){for(let i=0;i<n;i++)startDay();state.lastTick+=n*DAY;save()}}
function create(){const inp=document.getElementById('newname');const name=inp.value.trim();if(name.length<2||name.length>24){notify('Имя: от 2 до 24 символов');return}state={version:1,name,cash:10,days:0,created:Date.now(),lastTick:Date.now(),job:null,businesses:[],earned:0,businessEarned:0,spent:0,autoFood:false,logs:[]};log('Началась новая жизнь. Стартовый баланс: 10 ₴');save();tab='home';render()}
function registerView(){return `<section class="panel intro hero"><div class="muted">Твоя история начинается здесь</div><h2>Добро пожаловать в новую жизнь</h2><p class="muted">Создай персонажа, учись, работай, открывай предприятия и строй своё будущее.</p><label class="field" for="newname">Имя персонажа</label><input class="input" id="newname" maxlength="24" placeholder="Как тебя зовут?" autocomplete="off"><button class="btn full" style="margin-top:18px" onclick="create()">Начать жизнь →</button><p class="note">Начало в 16 лет · Экономический лицей · 10 ₴ на старте</p></section><section class="grid"><div class="stat">🎓<br><span>Образование</span></div><div class="stat">💼<br><span>Карьера</span></div><div class="stat">🏢<br><span>Бизнес</span></div><div class="stat">💰<br><span>Экономика</span></div></section>`}
function stats(){return `<div class="grid"><div class="stat"><span>Возраст</span><b>${age(state)} лет</b></div><div class="stat"><span>Личный баланс</span><b>${money(state.cash)}</b></div><div class="stat"><span>День жизни</span><b>${state.days+1}</b></div><div class="stat"><span>Мои предприятия</span><b>${state.businesses.length}</b></div></div>`}
function home(){const a=age(state),left=a<18?2-state.days:0;return `<section class="panel hero"><div class="muted">Привет, ${esc(state.name)} 👋</div><h2 style="margin-top:9px">${a<18?'Всё только начинается':'Твой путь — твои решения'}</h2><div class="money">${money(state.cash)}</div><p class="muted">Личный счёт персонажа</p></section>${stats()}<section class="panel"><h3>${a<18?'🎓 Экономический лицей':'📌 Сегодня в твоей жизни'}</h3>${a<18?`<p>Ты учишься на экономическом направлении. Обучение идёт автоматически, даже когда ты не в игре.</p><p class="muted">До совершеннолетия: ${left} ${left===1?'день':'дня'}. Стипендия: 0,50 ₴ в день.</p>`:`<p>Профессия: <strong>${state.job===null?'Пока не выбрана':JOBS[state.job][0]}</strong></p><p>Предприятия: <strong>${state.businesses.length}</strong></p><p class="muted">Питание списывается автоматически каждый день. Выбирай работу и развивай бизнес.</p>`}<div class="actions"><button class="btn" onclick="go('career')">💼 Работа</button><button class="btn secondary" onclick="go('business')">🏢 Бизнес</button></div></section><section class="panel"><h3>Последние события</h3>${history(4)}</section>`}
function career(){if(age(state)<18)return `<section class="panel"><h2>💼 Работа и карьера</h2><p>Профессии откроются после окончания экономического лицея в 18 лет.</p><p class="muted">Осталось ${2-state.days} дн.</p></section>`;return `<section class="panel"><h2>💼 Работа и карьера</h2><p class="muted">Выбери профессию. В этой одиночной версии зарплаты предварительные — общие фонды профессий появятся после подключения сервера.</p><div class="list">${JOBS.map((j,i)=>`<div class="item"><div class="row"><div><strong>${esc(j[0])}</strong><span class="muted small">${esc(j[1])}</span></div><span class="ok">${money(i===10?1.5:1)}/день</span></div><button class="btn ${state.job===i?'secondary':''}" ${state.job===i?'disabled':''} onclick="chooseJob(${i})">${state.job===i?'✓ Текущая работа':'Устроиться'}</button></div>`).join('')}</div></section>`}
function chooseJob(i){if(age(state)<18)return;state.job=i;log('Новая профессия: '+JOBS[i][0]);save();render();notify('Ты устроился на работу')}
function business(){if(age(state)<18)return `<section class="panel"><h2>🏢 Свой бизнес</h2><p>Открыть предприятие можно с 18 лет, после окончания лицея.</p></section>`;return `<section class="panel"><h2>🏢 Мои предприятия</h2><p class="muted">Прибыль хранится на счёте бизнеса отдельно от личных денег. Её можно вывести на личный баланс.</p>${state.businesses.length?`<div class="list">${state.businesses.map((b,i)=>`<div class="item"><strong>${esc(BUSINESSES[b.type].name)} #${i+1}</strong><p>Счёт предприятия: <b class="ok">${money(b.balance)}</b></p><p>Заработано всего: ${money(b.total)}</p><button class="btn secondary" onclick="withdraw(${i})" ${b.balance<=0?'disabled':''}>Вывести прибыль</button></div>`).join('')}</div>`:'<div class="empty">У тебя пока нет предприятий</div>'}</section><section class="panel"><h2>🏙️ Открыть предприятие</h2><p class="note">Показатели оборота здесь условные, для личной проверки интерфейса. В общей игре выручка будет зависеть от реальных покупок игроков.</p><div class="list">${BUSINESSES.map((b,i)=>`<div class="item"><div class="row"><div><strong>${esc(b.name)}</strong><p>Ожидаемый оборот ${money(b.revenue)}/день</p></div><strong>${money(b.cost)}</strong></div><button class="btn" ${state.cash<b.cost?'disabled':''} onclick="buyBusiness(${i})">Открыть бизнес</button></div>`).join('')}</div></section>`}
function buyBusiness(i){if(age(state)<18)return;const b=BUSINESSES[i];if(state.cash<b.cost){notify('Недостаточно денег');return}state.cash=+(state.cash-b.cost).toFixed(2);state.businesses.push({type:i,balance:0,total:0});log('Открыто предприятие «'+b.name+'»: −'+money(b.cost));save();render();notify('Предприятие открыто')}
function withdraw(i){const b=state.businesses[i];if(!b||b.balance<=0)return;const v=b.balance;b.balance=0;state.cash=+(state.cash+v).toFixed(2);log('Перевод со счёта предприятия: +'+money(v));save();render();notify('Прибыль переведена на личный счёт')}
function history(n){const l=state.logs.slice(0,n||70);return l.length?`<div class="list">${l.map(x=>`<div class="item small"><span class="muted">День ${x.day+1}</span><div>${esc(x.text)}</div></div>`).join('')}</div>`:'<div class="empty">Пока нет событий</div>'}
function economy(){const total=state.businesses.reduce((s,b)=>s+b.balance,0);return `<section class="panel"><h2>📊 Моя экономика</h2><div class="grid"><div class="stat"><span>Личный баланс</span><b>${money(state.cash)}</b></div><div class="stat"><span>Счета бизнеса</span><b>${money(total)}</b></div><div class="stat"><span>Зарплаты</span><b>${money(state.earned)}</b></div><div class="stat"><span>Прибыль предприятий</span><b>${money(state.businessEarned)}</b></div></div><p class="note">Суммы отражают только твоего персонажа. Одиночная модель не является общей экономикой 1 000 игроков: зарплаты и покупатели здесь условные. Реальные денежные потоки между игроками заработают с сервером и базой данных.</p></section><section class="panel"><h3>📜 История операций</h3>${history()}</section>`}
function settings(){return `<section class="panel"><h2>⚙️ Настройки</h2><p class="muted">Данные сохраняются на этом устройстве в браузере.</p><div class="row"><div><strong>Автопокупка улучшенного питания</strong><div class="small muted">0,35 ₴ вместо 0,20 ₴ в день</div></div><button class="btn secondary" onclick="toggleFood()">${state.autoFood?'Включено':'Выключено'}</button></div><div class="line"></div><div class="actions"><button class="btn secondary" onclick="exportSave()">⬇️ Сохранить прогресс в файл</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">⬆️ Загрузить сохранение</button></div><input id="importFile" type="file" accept="application/json,.json" onchange="importSave(event)"><div class="line"></div><button class="btn danger" onclick="resetGame()">Начать жизнь заново</button><p class="note">Если очистить данные сайта, прогресс может пропасть. Для переноса на другой телефон используй экспорт сохранения. После подключения общей базы потребуется отдельный перенос.</p></section>`}
function toggleFood(){state.autoFood=!state.autoFood;save();render()}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nova-life-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function importSave(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(s.version!==1||typeof s.name!=='string'||!Array.isArray(s.businesses)||!Array.isArray(s.logs)||!Number.isFinite(s.cash)||!Number.isFinite(s.days)||!Number.isFinite(s.lastTick))throw Error();state=s;save();render();notify('Сохранение загружено')}catch{notify('Неверный файл сохранения')}};r.readAsText(f)}
function resetGame(){if(confirm('Удалить персонажа и весь прогресс на этом устройстве?')){localStorage.removeItem(KEY);state=null;tab='home';render()}}
function go(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){sync();const app=document.getElementById('app');if(!state){app.innerHTML=registerView();return}const tabs=[['home','🏠 Главная'],['career','💼 Карьера'],['business','🏢 Бизнес'],['economy','📊 Экономика'],['settings','⚙️ Настройки']];app.innerHTML=`<nav class="tabs">${tabs.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}</nav>${({home,career,business,economy,settings}[tab]||home)()}<div class="panel"><div class="row"><div><strong>⏳ Время в игре</strong><div class="small muted">Новый игровой день каждые 24 часа</div></div><span class="pill">День ${state.days+1}</span></div><div class="small muted">До следующего дня: ${Math.max(0,Math.ceil((DAY-(Date.now()-state.lastTick))/3600000))} ч.</div></div>`}
render();setInterval(()=>{if(state&&dayProgress()>0)render()},60000);
</script></body></html>
