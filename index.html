function avatarKey(){return 'nova_avatar_v6_'+String(state?.id||'guest')}
function currentAvatar(){try{return JSON.parse(localStorage.getItem(avatarKey())||'null')}catch(e){return null}}
function portraitHtml(){let a=currentAvatar();if(a?.type==='photo'&&typeof a.value==='string'&&a.value.startsWith('data:image/jpeg;base64,'))return '<img src="'+a.value+'" alt="Аватар персонажа">';if(a?.type==='preset'&&PRESET_AVATARS.includes(a.value))return '<span class="portraitemoji">'+a.value+'</span>';return '<img src="'+DEFAULT_PORTRAIT+'" alt="Аватар персонажа">'}
function openAvatarPicker(){let a=currentAvatar();modal(`<h2>📷 Аватар персонажа</h2><p class="sub small">Выбери готовый образ или загрузи своё изображение. Изменить можно в любой момент.</p><div class="avatargrid">${PRESET_AVATARS.map((v,i)=>`<button class="avatarchoice ${a?.value===v?'chosen':''}" onclick="chooseAvatar(${i})">${v}</button>`).join('')}</div><label class="avatarupload">📁 Загрузить свою фотографию<input type="file" accept="image/*" style="display:none" onchange="uploadAvatar(this)"></label><p class="tiny" style="margin-top:10px">Пока аватар сохраняется только в этом браузере. После подключения серверного хранения его можно будет видеть на других устройствах.</p><button class="btn block" style="margin-top:10px" onclick="resetAvatar()">Вернуть стандартный портрет</button>`)}
function chooseAvatar(i){if(!PRESET_AVATARS[i])return;try{localStorage.setItem(avatarKey(),JSON.stringify({type:'preset',value:PRESET_AVATARS[i]}));closeModal();render();toast('Аватар изменён')}catch(e){toast('Не удалось сохранить аватар')}}
function resetAvatar(){localStorage.removeItem(avatarKey());closeModal();render()}
function uploadAvatar(input){const file=input.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Выбери изображение');return}if(file.size>12*1024*1024){toast('Файл больше 12 МБ');return}const reader=new FileReader();reader.onerror=()=>toast('Не удалось прочитать фото');reader.onload=()=>{const im=new Image();im.onerror=()=>toast('Неподдерживаемый формат');im.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=320;c.height=400;const scale=Math.max(c.width/im.width,c.height/im.height),w=im.width*scale,h=im.height*scale;ctx.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h);try{localStorage.setItem(avatarKey(),JSON.stringify({type:'photo',value:c.toDataURL('image/jpeg',.78)}));closeModal();render();toast('Фото сохранено')}catch(e){toast('Недостаточно места для фотографии')}};im.src=reader.result};reader.readAsDataURL(file)}

function heroCard(){let d=state.data;return `<div class="card glass"><div class="profile-hero"><button class="portraitpick" onclick="openAvatarPicker()" title="Изменить аватар"><span class="portraitdisplay" id="playerportrait">${portraitHtml()}</span><span class="portraitcamera">📷 Изменить</span></button><div class="profile-info"><div class="name">${esc(state.name)}</div><div>${state.age} лет · ${esc(d.job|| (state.age<18?'Студент':'Без работы'))}</div><div class="sub">ID ${state.id}</div></div></div><div class="info-lines"><div class="info-line"><span class="symbol">🎓</span><span class="label">Образование</span><b>${esc(d.study||d.education.at(-1)||'Не выбрано')}</b></div><div class="info-line"><span class="symbol">🏠</span><span class="label">Место жительства</span><b>${esc(d.home)}</b></div><div class="info-line"><span class="symbol">👥</span><span class="label">Семейное положение</span><b>${esc(d.family)}</b></div></div></div>`}
function balanceCards(){let d=state.data;return `<div class="two"><div class="card statcard"><div class="stathead"><div class="iconbox">💵</div><div><div class="statlabel">Игровой баланс</div><div class="money">${money(d.balance)} ₴</div></div></div><button class="btn green block" onclick="topup()">Пополнить</button></div><div class="card statcard"><div class="stathead"><div class="iconbox gold">🪙</div><div><div class="statlabel">Доступно к выводу</div><div class="money white">0 ₴</div></div></div><button class="btn gray block" disabled>Вывести</button><div class="mini-caption">В разработке</div></div></div>`}
function meter(label,n,color=''){let p=percent(n);return `<div class="meter"><div class="meterline"><span>${label}</span><b class="meter-value">${p.toFixed(2)}%</b></div><div class="progress"><div class="fill ${color}" style="width:${p}%"></div></div></div>`}
function liveNeedMeter(label,key,n,color=''){let p=percent(n);return `<div class="meter"><div class="meterline"><span>${label}</span><b class="meter-value" data-need-value="${key}">${p.toFixed(2)}%</b></div><div class="progress"><div class="fill ${color}" data-need-bar="${key}" style="width:${p}%"></div></div></div>`}

function profile(){let d=state.data;return `<div class="life-banner"><span>⌛ Время жизни</span><b data-life-clock>${lifeText()}</b></div><div class="sectionhead"><h2>👤 Мой профиль</h2><button class="btn sm" onclick="showSecurity()">🛡️ Безопасность</button></div>${heroCard()}<div class="card"><div class="row"><div><h3 style="margin:0">🎓 Образование и стипендия</h3><div class="sub small">${esc(d.study||d.education.at(-1)||'Направление ещё не выбрано')}</div></div><button class="btn sm" onclick="openTab('study')">Открыть ›</button></div>${schoolMeter()}<div class="scholarship-strip">💰 ${money(state.stipend_amount||1)} ₴ · каждые 8 месяцев <span data-stipend-left>${scholarshipStatus()}</span></div></div>${needsCard()}<div class="card"><h3>📋 Данные персонажа</h3>${[['Возраст',state.age+' лет'],['Работа',d.job||'Нет'],['Отработано суток',Number(d.workdays||0).toFixed(1)],['Образование',d.education.join(', ')||'Не завершено'],['Бизнесов',d.businesses.length],['Баланс',money(d.balance)+' ₴']].map(([k,v])=>`<div class="row line"><span class="sub">${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div><div class="card"><h3>📜 История операций</h3>${state.ledger.length?state.ledger.slice(0,20).map(x=>`<div class="row line"><span class="small">${esc(x.reason)}</span><b class="${x.amount>=0?'ok':''}">${x.amount>=0?'+':''}${money(x.amount)} ₴</b></div>`).join(''):'<p class="sub">Пока нет операций</p>'}</div>`}
function work(){let d=state.data;return `<div class="sectionhead"><h2>💼 Работа и карьера</h2></div><div class="card"><h3>Текущая работа</h3><div class="row"><b>${esc(d.job||'Не трудоустроен')}</b><span class="chip">${d.employer==='state'?'Государство':'Частный бизнес'}</span></div><div class="row line"><span class="sub">Отработано суток</span><b>${Number(d.workdays||0).toFixed(1)}</b></div><p class="small sub">Повышения после 7, 21 и 45 суток работы. Стаж каждой профессии сохраняется при переходе на другую работу.</p></div><div class="card"><h3>Государственные вакансии</h3>${(config?.jobs||[]).map(j=>`<div class="jobitem"><div class="iconbox orange">${j.icon}</div><div class="info"><b>${esc(j.name)}</b><div class="sub">${money(j.start)}–${money(j.max)} ₴/сутки</div><div class="tiny">Нагрузка: ${esc(j.load)}</div></div><button class="btn sm" onclick="jobModal('${esc(j.name)}')">Подробнее ›</button></div>`).join('')}</div><div class="card"><h3>🏢 Частные вакансии</h3><p class="sub small">Ограниченные рабочие места и зарплаты от предприятий подключим отдельным этапом. Пока доступна государственная работа.</p></div>`}
function jobModal(name){let j=(config?.jobs||[]).find(x=>x.name===name);if(!j)return;let d=state.data;let shifts=Number(d.experience[name]||0)/24;let levels=[0,7,21,45];modal(`<h2>${j.icon} ${esc(j.name)}</h2><p class="sub small">Государственная вакансия · ${esc(j.load)} нагрузка</p><div class="card" style="margin:12px 0"><h3>💰 Зарплата и повышения</h3>${levels.map((n,i)=>`<div class="wage"><span>${n===0?'Начальная должность':'После '+n+' суток'} ${shifts>=n?'✓':''}</span><b>${money(j.start+(j.max-j.start)*i/3)} ₴/сутки</b></div>`).join('')}<p class="small sub" style="margin:10px 0 0">Твой стаж по профессии: ${shifts.toFixed(1)} суток</p></div><div class="card" style="margin:12px 0"><h3>🍽️ Расходы и нагрузка</h3>${meter('Еда за смену',j.food)}${meter('Вода за смену',j.water,'blue')}<p class="sub small">При нехватке запасов система покупает необходимое по цене ×2.</p></div><button class="btn blue block" ${state.age<18?'disabled':''} onclick="act('job','${esc(j.name)}')">${d.job===name?'Работа выбрана':'Устроиться на работу'}</button>${state.age<18?'<p class="tiny">Доступно с 18 лет</p>':''}`)}
function study(){let d=state.data;return `<div class="sectionhead"><h2>🎓 Образование</h2><span class="chip">Твоя карьера</span></div><div class="card education-hero"><div class="row"><div><span class="eyebrow">МОЯ УЧЁБА</span><h3>${esc(d.study||d.education.at(-1)||'Выбери направление')}</h3><div class="sub small">Продолжительность: <strong>2 года</strong></div></div><div class="edu-icon">🎓</div></div>${schoolMeter()}<div class="school-meta"><span>Осталось <b data-study-left>${d.study?schoolTimeLeft():d.education.length?'Обучение завершено':'—'}</b></span><span>${d.study?'Выпуск впереди':d.education.length?'🎖 Диплом получен':'Поступи и начни учиться'}</span></div></div><div class="card scholarship-card"><div class="row"><div><span class="eyebrow">СТУДЕНЧЕСКИЕ ВЫПЛАТЫ</span><h3>💰 Стипендия</h3></div><b class="scholarship-amount">${money(state.stipend_amount||1)} ₴</b></div><p class="sub small">Начисляется каждые 8 месяцев учащимся до 18 лет. После окончания программы выплаты продолжаются до совершеннолетия.</p><div class="scholarship-row"><span>Следующая выплата</span><b data-stipend-left>${scholarshipStatus()}</b></div></div><div class="card"><h3>Учебные заведения</h3>${(config?.studies||[]).map(s=>`<div class="school-option"><div class="edu-option-icon">${s.includes('IT')?'💻':s.includes('Эконом')?'📊':s.includes('Технический')?'🔧':'🎨'}</div><div class="school-option-copy"><b>${esc(s)}</b><span class="sub small">2 года · Диплом · Стипендия</span></div><button class="btn sm" onclick="studyInfo('${esc(s)}')">${d.education.includes(s)?'Диплом ✓':d.study===s?'Моя учёба':'Подробнее ›'}</button></div>`).join('')}</div>`}
function studyInfo(name){let d=state.data,active=d.study===name,completed=d.education.includes(name);modal(`<h2>🎓 ${esc(name)}</h2><div class="school-intro">Построй будущее в Республике. Получи образование, выбери профессию и расти по карьерной лестнице.</div><div class="edu-info-grid"><div class="edu-detail"><span>📚 Продолжительность</span><b>2 года</b></div><div class="edu-detail"><span>💰 Стипендия</span><b>${money(state.stipend_amount||1)} ₴</b><small>Каждые 8 месяцев</small></div><div class="edu-detail"><span>🏅 После выпуска</span><b>Диплом</b></div><div class="edu-detail"><span>🎯 Прогресс</span><b ${active?'data-study-percent':''}>${active?studyPercent().toFixed(2):completed?'100.00':'0.00'}%</b></div></div><p class="small sub">Выплаты студентам до 18 лет. Прогресс сохраняется автоматически, даже когда ты вне игры.</p><button class="btn blue block" ${active||completed||!!d.study?'disabled':''} onclick="act('study','${esc(name)}')">${completed?'Диплом получен':active?'Ты уже учишься':d.study?'Сначала закончи текущую программу':'Поступить'}</button>`)}
function business(){let d=state.data;return `<h2>🏢 Бизнес Республики</h2><div class="card"><h3>Мои предприятия</h3>${d.businesses.length?d.businesses.map(b=>{let x=config.businesses[b.type];return `<div class="row line"><span>${x.icon} ${esc(x.name)}</span><b class="ok">+${money(x.profit)} ₴/сутки</b></div>`}).join(''):'<p class="sub">Пока нет предприятий</p>'}</div><div class="card"><h3>Купить предприятие</h3>${(config?.businesses||[]).map((b,i)=>`<div class="jobitem"><div class="iconbox purple">${b.icon}</div><div class="info"><b>${esc(b.name)}</b><div class="sub">${money(b.price)} ₴ · +${money(b.profit)} ₴/сутки</div><div class="tiny">Окупаемость ~${Math.ceil(b.price/b.profit)} дней</div></div><button class="btn sm" onclick="businessModal(${i})">Подробнее ›</button></div>`).join('')}</div><p class="footer-note">Доходность пока фиксированная и начисляется сервером. При переходе к замкнутой экономике она будет зависеть от продаж, зарплат и расходов.</p>`}
function businessModal(i){let b=config.businesses[i];modal(`<h2>${b.icon} ${esc(b.name)}</h2><div class="card"><div class="row line"><span>Стоимость</span><b>${money(b.price)} ₴</b></div><div class="row line"><span>Чистый доход в сутки</span><b class="ok">+${money(b.profit)} ₴</b></div><div class="row line"><span>Окупаемость</span><b>~${Math.ceil(b.price/b.profit)} дней</b></div><div class="row line"><span>Профессия работников</span><b>${esc(b.job)}</b></div></div><p class="sub small">Фиксированная доходность первого этапа. Дальше добавим найм сотрудников, спрос, расходы и реальную прибыль.</p><button class="btn purple block" onclick="act('buy_business','${i}')">Купить за ${money(b.price)} ₴</button>`)}
function shop(){let d=state.data;return `<h2>🛒 Магазин</h2>${needsCard()}<div class="card"><h3>Продукты и вода</h3><p class="sub small">Покупки пополняют шкалы до 100%. Если еды или воды не хватит, система автоматически докупит необходимое по двойной цене.</p>${[['food','🥪 Еда',.35],['water','💧 Вода',.15]].map(([key,name,price])=>`<div class="line"><div class="row"><b>${name}</b><span class="sub small">${money(price)} ₴ за 100 единиц</span></div><div class="row" style="margin-top:10px"><span class="sub">${Math.round(d[key])}/100</span><div style="display:flex;gap:6px"><button class="btn sm" onclick="act('${key}','10')">+10</button><button class="btn sm" onclick="act('${key}','25')">+25</button><button class="btn sm" onclick="act('${key}','50')">+50</button></div></div></div>`).join('')}</div>`}
function bank(){return `<h2>🏦 Банк</h2>${balanceCards()}<div class="card"><h3>Банковские услуги</h3><p class="sub">Депозиты, переводы и кредиты появятся после запуска финансового модуля. Пока игровые средства хранятся на сервере.</p></div>`}
function placeholder(title,body){return `<div class="card"><h2>${title}</h2><p class="sub">${body}</p></div>`}
function topup(){modal(`<h2>💚 Пополнение баланса</h2><p class="sub">Пополнение реальными деньгами пока не подключено. После настройки платёжного провайдера здесь появятся способы оплаты.</p><div class="card"><b>Игровой баланс: ${money(state.data.balance)} ₴</b></div><button class="btn gray block" disabled>Пополнить</button><p class="tiny">Платёжные данные не собираются. Баланс нельзя увеличить через браузер.</p>`)}
function modal(content){$('modalroot').innerHTML=`<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="modalclose" onclick="closeModal()">✕</button>${content}</div></div>`}
function closeModal(){$('modalroot').innerHTML=''}
async function act(type,value){try{let r=await request('/api/action','POST',{type,value});state=r;syncLife();closeModal();render();toast('Готово!')}catch(e){toast(e.message)}}
async function showSecurity(){
 try{let x=await request('/api/security');modal(`<h2>🛡️ Безопасность аккаунта</h2><p class="sub small">ID ${esc(state.id)} · Привяжи оба способа входа, чтобы снизить риск потери аккаунта.</p><div class="security-state"><b>✈️ Telegram</b><span class="chip">${x.telegram?'✓ Привязан':'Не привязан'}</span></div><div class="security-state"><b>🔑 Логин и пароль</b><span class="chip">${x.password?'✓ Настроены':'Не настроены'}</span></div>${!x.password?`<div class="security-hint">Создай отдельный логин и пароль, чтобы входить без Telegram.</div><label class="small sub">Новый логин</label><input id="secureuser" placeholder="Минимум 3 символа" autocomplete="username"/><label class="small sub">Новый пароль</label><input id="securepass" type="password" placeholder="Минимум 8 символов" autocomplete="new-password"/><button class="btn blue block" onclick="addPassword()">Добавить пароль</button>`:''}${!x.telegram?`<div class="security-hint">Привяжи Telegram к этому аккаунту. Это не создаст новый игровой ID.</div><button class="btn blue block" onclick="linkTelegram()">✈️ Привязать Telegram</button>`:''}<div class="security-hint">Никому не передавай пароль и код доступа. Восстановление без привязанного способа входа пока недоступно.</div>`)}catch(e){toast(e.message)}
}
async function addPassword(){try{const username=$('secureuser').value.trim(),password=$('securepass').value;await request('/api/security/password','POST',{username,password});toast('Пароль настроен');showSecurity()}catch(e){toast(e.message)}}
async function linkTelegram(){const init_data=window.Telegram?.WebApp?.initData;if(!init_data){toast('Открой этот аккаунт внутри Telegram Mini App, затем повтори привязку');return}try{await request('/api/security/telegram','POST',{init_data});toast('Telegram привязан');showSecurity()}catch(e){toast(e.message)}}
function showSettings(){modal(`<h2>⚙️ Настройки</h2><p class="sub small">Игра автоматически подключается к серверу Railway.</p><button class="btn blue block" onclick="checkConnection()">Проверить соединение</button><div style="margin-top:10px"><button class="btn block" onclick="logout()">Выйти из аккаунта</button></div>`)}
async function checkConnection(){try{let h=await request('/api/health');toast(h.database==='connected'?'Сервер и база подключены!':'Сервер отвечает')}catch(e){toast(e.message)}}
function logout(){token='';state=null;econ=null;localStorage.removeItem(STORAGE_TOKEN);closeModal();render()}
async function loginTelegram(){
 const tg=window.Telegram?.WebApp;
 if(!tg?.initData){toast('Открой игру через кнопку Mini App в Telegram-боте');return}
 try{const r=await request('/api/telegram/auth','POST',{init_data:tg.initData});token=r.token;localStorage.setItem(STORAGE_TOKEN,token);config=await request('/api/config');state=await request('/api/me');econ=await request('/api/economy');syncLife();tab='home';render();tg.ready()}catch(e){toast(e.message)}
}
async function startGame(){
 const tg=window.Telegram?.WebApp;
 if(tg?.initData){await loginTelegram();if(state)return}
 await connect();
}
let refreshing=false;
async function refreshGame(){
 if(refreshing||!state||!token||document.visibilityState==='hidden')return;
 refreshing=true;
 try{
  const fresh=await request('/api/me');
  if(!state)return;
  state=fresh;econ=await request('/api/economy');syncLife();
  const scrollY=window.scrollY;
  render();
  if(Math.abs(window.scrollY-scrollY)>3)window.scrollTo(0,scrollY);
 }catch(e){console.warn('Обновление состояния:',e.message)}
 finally{refreshing=false}
}
setInterval(refreshGame,20000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshGame()});
// NOVAYA ZHIZN · working economy screens (all operations are server verified).
const previousHome = home;
const previousNeedsCard = needsCard;
function econNum(v){return Number(v||0).toFixed(2)}
function econFormat(v){return `${econNum(v)} ЖН`}
function balanceCards(){const d=state.data;return `<div class="two"><div class="card statcard"><div class="stathead"><div class="iconbox">🪙</div><div><div class="statlabel">Мой баланс</div><div class="money">${econFormat(d.balance)}</div></div></div><button class="btn green block" onclick="openTab('shop')">🛒 Потратить</button></div><div class="card statcard"><div class="stathead"><div class="iconbox gold">🏛️</div><div><div class="statlabel">Госказна</div><div class="money white">${econFormat(econ?.treasury)}</div></div></div><button class="btn block" onclick="openTab('bank')">Банк Республики</button></div></div>`}
needsCard=function(){return previousNeedsCard().replace('Зарплата, потребности и доход предприятий продолжают рассчитываться, даже когда тебя нет в игре.','Потребности меняются со временем. Доходы бизнеса зависят от настоящих игровых покупок, зарплаты — от средств отрасли.');}
function economyHighlights(){return `<div class="card econ-glow"><div class="row"><div><b>🌍 Экономика Республики</b><div class="sub small">Одна валюта · реальные игровые покупки</div></div><span class="chip">ЖН</span></div><div class="econ-summary-grid"><div><small>Выпущено жетонов</small><b>${econFormat(econ?.minted)}</b></div><div><small>Банк: доступно на кредиты</small><b>${econFormat(econ?.bank_credit_available)}</b></div></div><div class="sub small" style="margin-top:10px">Настоящие ₴: резерв не подтверждён. Обмен и вывод отключены. Жетоны не обеспечены реальными выплатами.</div><div class="row" style="margin-top:12px"><button class="btn sm" onclick="openTab('business')">🏢 Бизнес</button><button class="btn sm" onclick="openTab('bank')">🏦 Банк</button></div></div>`}
home=function(){const page=previousHome(), marker='<div class="card"><div class="row"><h3 style="margin:0">🎓 Обучение';return page.includes(marker)?page.replace(marker,economyHighlights()+marker):page+economyHighlights()}
menu=function(){const items=[['home','⌂','Главная'],['profile','♙','Профиль'],['work','💼','Работа'],['business','🏢','Бизнес'],['bank','🏦','Банк']];$('nav').style.display=state?'flex':'none';$('nav').innerHTML=items.map(([id,icon,name])=>`<button class="${tab===id?'active':''}" onclick="openTab('${id}')"><span>${icon}</span>${name}</button>`).join('')}
async function econAction(type,extras={}){
 try{const r=await request('/api/economy/action','POST',{type,...extras});state=r.player;econ=r.economy;syncLife();closeModal();render();toast('Операция выполнена')}
 catch(e){toast(e.message)}
}
async function econRefresh(){if(!token)return;try{econ=await request('/api/economy');render()}catch(e){console.warn('Экономика:',e.message)}}
function work(){const all=econ?.sectors||[],my=econ?.my_job;const queues=econ?.queued||[];return `<h2>💼 Биржа труда Республики</h2><div class="card"><div class="row"><div><h3>Твоя работа</h3><div class="sub">${my?esc(all.find(x=>x.key===my)?.name||my):'Безработный'}</div></div>${my?`<button class="btn sm" onclick="econAction('leave')">Уволиться</button>`:'<span class="chip">Поиск работы</span>'}</div><p class="small sub">Вакансии ограничены фондом зарплат. Прогноз дохода меняется с количеством сотрудников и продаж. Уже начисленную зарплату не уменьшают.</p>${queues.length?`<h3>📋 Очередь</h3>${queues.map(q=>`<div class="line row"><span>${esc(all.find(s=>s.key===q.sector)?.name||q.sector)} · №${q.position}</span><button class="btn sm" onclick="econAction('cancel_queue',{sector:'${q.sector}'})">Отменить</button></div>`).join('')}`:''}</div><div class="card"><h3>Доступные профессии</h3>${all.map(s=>`<div class="jobitem"><div class="iconbox orange">${esc(s.name.slice(0,2))}</div><div class="info"><b>${esc(s.name)}</b><div class="sub">${esc(s.job)} · ${s.available_jobs} вакансий</div><div class="tiny">Прогноз: ${econFormat(s.estimated_wage)} за оплаченный день</div></div><button class="btn sm" ${state.age<18?'disabled':''} onclick="econAction('apply',{sector:'${s.key}'})">${s.available_jobs?'Устроиться':'В очередь'}</button></div>`).join('')}</div><div class="card"><h3>Как распределяется зарплата?</h3><p class="small sub">Часть оплаченных покупок поступает в фонд профессии. Фонд делится между действующими работниками по оплачиваемым периодам в пределах доступных средств. Если фонд пустой, денег не начисляется.</p></div>`}
function business(){const all=econ?.sectors||[];return `<h2>🏢 Бизнес Республики</h2><div class="card"><h3>Твои доли</h3>${all.some(s=>s.my_shares)?all.filter(s=>s.my_shares).map(s=>`<div class="line"><div class="row"><b>${esc(s.name)}</b><span class="ok">${econNum(s.my_percent)}%</span></div><div class="small sub">${s.my_shares} долей · владельцев всего: ${s.owners} · общий доход отрасли: ${econFormat(s.profit_total)}</div><div class="row" style="margin-top:8px"><button class="btn sm" onclick="openHiring('${s.key}')">👥 Управление наймом</button></div></div>`).join(''):'<p class="sub">Пока нет купленных долей. До приватизации доход принадлежит казне.</p>'}</div><div class="card"><h3>Купить долю отрасли</h3><p class="small sub">Деньги от покупки получает государство. Доход от будущих покупок делится между всеми владельцами пропорционально количеству их долей.</p>${all.map(s=>`<div class="jobitem"><div class="iconbox purple">${esc(s.name.slice(0,2))}</div><div class="info"><b>${esc(s.name)}</b><div class="sub">${econFormat(s.price)} · владельцев ${s.owners}</div><div class="tiny">Продажи всего: ${econFormat(s.sales_total)} · фонд зарплат: ${econFormat(s.wage_fund)}</div></div><button class="btn sm" onclick="showSector('${s.key}')">Подробнее</button></div>`).join('')}</div><p class="footer-note">Нет фиксированной доходности, гарантированной окупаемости или реального вывода. Доход формируют только покупки игроков, зарплатные фонды и расходы учитываются сервером.</p>`}
function showSector(key){const s=econ?.sectors.find(x=>x.key===key);if(!s)return;const predicted=100/(s.owners+1);modal(`<h2>${esc(s.name)}</h2><div class="card"><div class="row line"><span>Доля стоит</span><b>${econFormat(s.price)}</b></div><div class="row line"><span>Всего долей куплено</span><b>${s.owners}</b></div><div class="row line"><span>Ваша новая доля при покупке</span><b>${econNum(predicted)}%</b></div><div class="row line"><span>Вся выручка за историю</span><b>${econFormat(s.sales_total)}</b></div><div class="row line"><span>Выплаченная прибыль за историю</span><b>${econFormat(s.profit_total)}</b></div><div class="row line"><span>Фонд зарплаты</span><b>${econFormat(s.wage_fund)}</b></div></div><p class="sub small">Государство получает цену продажи, а будущая прибыль делится между долями. Прежние владельцы не получают деньги за появление новых покупателей.</p><button class="btn purple block" onclick="econAction('share',{sector:'${key}'})">Купить долю за ${econFormat(s.price)}</button>`)}
async function openHiring(key){try{let data=await request('/api/economy/queue/'+key),staff=await request('/api/economy/workers/'+key);let s=econ.sectors.find(x=>x.key===key);modal(`<h2>👥 Найм: ${esc(s.name)}</h2><p class="sub small">Инициатор найма получает 20% от подтверждённой дополнительной чистой прибыли продаж, выполненных благодаря расширению мощности. Остаток делят все владельцы, включая инициатора.</p><p>Вакансии: <b>${s.available_jobs}</b></p><div class="row"><input id="payrollInvest" type="number" min="1" step="1" value="7" style="max-width:120px"/><button class="btn sm green" onclick="econAction('finance',{sector:'${key}',amount:Number($('payrollInvest').value)})">Вложить в фонд зарплат</button></div><p class="tiny">Вклад расходуется только на реальные зарплаты, не даёт новых долей.</p>${data.candidates.length?data.candidates.map(c=>`<div class="row line"><span>Игрок ID ${String(c.id).padStart(8,'0')}</span><button class="btn sm" onclick="econAction('hire',{sector:'${key}',target_id:${c.id}})">Нанять</button></div>`).join(''):'<p class="sub">Очередь пока пуста.</p>'}<h3 style="margin-top:15px">Сотрудники</h3>${staff.workers.length?staff.workers.map(w=>`<div class="row line"><span>ID ${String(w.id).padStart(8,'0')}</span><button class="btn sm" onclick="if(confirm('Уволить сотрудника?'))econAction('fire',{sector:'${key}',target_id:${w.id}})">Уволить</button></div>`).join(''):'<p class="small sub">Работников нет</p>'}<p class="tiny">Заработанное до увольнения сохраняется. Сотрудник может встать на биржу снова.</p><button class="btn sm block" onclick="closeModal()">Закрыть</button>`)}catch(e){toast(e.message)}}
function shop(){const items=econ?.items||[];return `<h2>🛒 Магазин Республики</h2>${needsCard()}<div class="card"><h3>Товары и услуги</h3><p class="sub small">Каждая покупка перечисляет виртуальные жетоны в отрасли, поставщикам, работникам, владельцам и государству. Товары не создают деньги.</p>${items.map(i=>`<div class="jobitem"><div class="info"><b>${esc(i.name)}</b><div class="sub">${econFormat(i.price)}</div><div class="tiny">${i.food?'Сытость +'+i.food+' · ':''}${i.water?'Вода +'+i.water+' · ':''}${i.energy?'Энергия +'+i.energy:''}</div></div><button class="btn sm green" onclick="econAction('buy',{item:'${i.id}',quantity:1})">Купить</button></div>`).join('')}</div>`}
function bank(){return `<h2>🏦 Банк Республики</h2>${balanceCards()}<div class="card"><h3>🪙 Виртуальные депозиты</h3><p class="sub small">Тело депозитов неприкосновенно, банк не выдаёт его в кредит. Проценты до 0,25% в день выплачиваются только из реально полученных банком виртуальных доходов, не гарантированы.</p><div class="row line"><span>Мой депозит</span><b>${econFormat(econ?.deposit)}</b></div><input id="econDepositAmount" type="number" min="0.01" step="0.01" value="1" placeholder="Сумма ЖН"/><div class="row"><button class="btn green" onclick="econMoney('deposit')">Внести</button><button class="btn" onclick="econMoney('undeposit')">Забрать</button></div></div><div class="card"><h3>💳 Кредиты с 30 лет</h3><p class="small sub">Ставка 1% в день на остаток долга. Проценты списываются автоматически с игрового баланса. Тело можно погасить в любой момент. Сумма ограничена доходом и капиталом банка.</p><div class="row line"><span>Доступный кредитный фонд</span><b>${econFormat(econ?.bank_credit_available)}</b></div><div class="row line"><span>Мой долг</span><b>${econFormat(econ?.loan)}</b></div><div class="row line"><span>Непогашенные проценты</span><b>${econFormat(econ?.interest_due)}</b></div><input id="econCreditAmount" type="number" min="0.01" step="0.01" value="1" placeholder="Сумма ЖН"/><div class="row"><button class="btn blue" ${state.age<30?'disabled':''} onclick="econMoney('credit')">Взять кредит</button><button class="btn" onclick="econMoney('repay')">Погасить</button></div></div><div class="card"><h3>🏛️ Реальные деньги</h3><p class="sub">Реальный резерв пока не подтверждён. Обмен ЖН на ₴, реальные депозиты и выплаты сейчас <b>отключены</b>. Никакого обещанного курса нет.</p></div>`}
function econMoney(type){const id=type==='deposit'||type==='undeposit'?'econDepositAmount':'econCreditAmount';const amount=Number($(id)?.value);if(!Number.isFinite(amount)||amount<=0){toast('Укажи положительную сумму');return}econAction(type,{amount})}

function financeV91(){const mint=Math.max(0,Number(econ?.minted||0)),tr=Number(econ?.treasury||0),bk=Number(econ?.bank_credit_available||0);return `<h2>📊 Финансы Республики</h2><div class="card"><span class="eyebrow">Игровая валюта ЖН</span><h2 style="margin:6px 0 15px;color:#75f2bb">Курс к ₴ пока не установлен</h2><div class="finance-kpi"><div><small>Всего выпущено ЖН</small><b>${econFormat(mint)}</b></div><div><small>Игровая казна</small><b>${econFormat(tr)}</b></div><div><small>Кредитный фонд банка</small><b>${econFormat(bk)}</b></div><div><small>Реальный резерв</small><b>Не подключён</b></div></div><p class="tiny">Реальный курс и история его изменения не отображаются, пока нет проверенного резерва и расчёта обязательств.</p></div><div class="card"><h3>Как работает экономика</h3><p class="sub small">Деньги из покупок идут производителям, ТЭЦ, зарплатным фондам, государству и владельцам. Все переводы учитывает сервер. Реальные выплаты не включены.</p><button class="btn blue block" onclick="openTab('business')">Посмотреть предприятия</button></div>`};
function workV91(){const all=[...(econ?.sectors||[])].sort((a,b)=>Number(a.estimated_wage||0)-Number(b.estimated_wage||0)||a.price-b.price),my=econ?.my_job,queues=econ?.queued||[];return `<div class="metro-head"><b>💼 Работа и вакансии</b><span class="pretty-pill">Биржа труда</span></div><div class="card"><div class="row"><div><b>${my?esc(all.find(s=>s.key===my)?.job||my):'Сейчас без работы'}</b><div class="sub small">${my?'Трудоустроен · данные сервера':'Подай заявку на подходящую вакансию'}</div></div>${my?`<button class="btn sm" onclick="econAction('leave')">Уволиться</button>`:'<span class="pretty-pill">Поиск работы</span>'}</div>${queues.map(q=>`<div class="line row"><span class="small">В очереди: ${esc(all.find(s=>s.key===q.sector)?.name||q.sector)} · №${q.position}</span><button class="btn sm" onclick="econAction('cancel_queue',{sector:'${q.sector}'})">Отменить</button></div>`).join('')}</div><div class="card"><div class="market-tabs"><button class="active" disabled>Вакансии</button><button onclick="showMyQueues()">Моя очередь</button><button onclick="openTab('study')">Обучение</button></div><p class="small sub" style="margin:1px 0 10px">Сортировка: от меньшей прогнозной зарплаты к большей</p>${all.map(s=>`<div class="job-list"><img class="job-thumb" src="${JOB_PICTURES[s.key]||SECTOR_PICTURES[s.key]||''}" alt="${esc(s.job)}" loading="lazy"><div class="job-main"><b>${esc(s.job)}</b><small>${esc(s.name)}</small><small>Прогноз ${econFormat(s.estimated_wage)} / день</small><small>${s.available_jobs?`${s.available_jobs} свободных мест`:'Мест нет · очередь'}</small></div><button class="btn ${s.available_jobs?'blue':''}" ${state.age<18?'disabled':''} onclick="econAction('apply',{sector:'${s.key}'})">${s.available_jobs?'Подать заявку':'В очередь'}</button></div>`).join('')}</div><div class="card"><p class="small sub">Оплачиваемых мест не больше, чем позволяет фонд. Зарплата зависит от доходов отрасли и количества работников. Прогноз не является гарантированной ставкой.</p></div>`};
